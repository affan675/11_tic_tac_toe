<!-- xOarena/404.html -->
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X O Arena — 404</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Override common.css cursor rule for this page */
        body.not-found-page,
        body.not-found-page * {
            cursor: auto !important;
        }
        /* Restore pointer on interactive elements */
        body.not-found-page .nf-cell,
        body.not-found-page button,
        body.not-found-page a,
        body.not-found-page .nf-btn {
            cursor: pointer !important;
        }

        body.not-found-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg);
            flex-direction: column;
            gap: 1.5rem;
            padding: 1rem;
        }
        .nf-container {
            text-align: center;
            background: var(--surface);
            border-radius: 2rem;
            padding: 3rem 2rem;
            box-shadow: var(--card-shadow);
            border: 1px solid var(--border);
            max-width: 500px;
            width: 100%;
        }
        .nf-title {
            font-size: clamp(2.5rem, 10vw, 4rem);
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .nf-sub {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .nf-board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.8rem;
            max-width: 260px;
            margin: 0 auto 1.5rem;
        }
        .nf-cell {
            aspect-ratio: 1/1;
            background: var(--hover-bg);
            border: 2px solid var(--border);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: 800;
            transition: 0.2s;
            color: var(--text);
        }
        .nf-cell:hover {
            border-color: var(--primary);
            box-shadow: var(--glow);
        }
        .nf-cell.x-symbol { color: var(--x-symbol); }
        .nf-cell.o-symbol { color: var(--o-symbol); }
        .nf-message {
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 2rem;
            color: var(--primary);
            margin: 0.5rem 0;
        }
        .nf-btn {
            display: inline-block;
            margin-top: 1rem;
            background: var(--primary);
            color: white;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(59,130,246,0.3);
        }
        .nf-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(59,130,246,0.5);
        }
    </style>
</head>
<body class="not-found-page">

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Audio Elements -->
    <audio id="clickSound" preload="auto" src="assets/sounds/click.mp3"></audio>
    <audio id="winnerSound" preload="auto" src="assets/sounds/winner.mp3"></audio>
    <audio id="achievementSound" preload="auto" src="assets/sounds/achievement.mp3"></audio>

    <div class="nf-container">
        <h1 class="nf-title">4😵4</h1>
        <p class="nf-sub">Oops! This page is out of bounds.</p>
        <p class="nf-sub">But hey – how about a quick Tic‑Tac‑Toe break?</p>

        <!-- Mini Game Board -->
        <div class="nf-board" id="nfBoard">
            <div class="nf-cell" data-index="0"></div>
            <div class="nf-cell" data-index="1"></div>
            <div class="nf-cell" data-index="2"></div>
            <div class="nf-cell" data-index="3"></div>
            <div class="nf-cell" data-index="4"></div>
            <div class="nf-cell" data-index="5"></div>
            <div class="nf-cell" data-index="6"></div>
            <div class="nf-cell" data-index="7"></div>
            <div class="nf-cell" data-index="8"></div>
        </div>
        <div class="nf-message" id="nfMessage">Your turn! (You are X)</div>
        <button id="nfResetBtn" class="btn btn-secondary" style="margin:0.5rem; cursor:pointer;">🔄 Play Again</button>
        <br>
        <a href="index.html" class="nf-btn" id="nfHomeBtn">🏠 Back to Home</a>
    </div>

    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="celebration-overlay"></div>

    <script src="js/theme.js"></script>
    <script src="js/soundManager.js"></script>
    <script>
        // Mini Tic-Tac-Toe game for 404 page
        (function() {
            const boardEl = document.getElementById('nfBoard');
            const msgEl = document.getElementById('nfMessage');
            const cells = boardEl.querySelectorAll('.nf-cell');
            const resetBtn = document.getElementById('nfResetBtn');

            let board = Array(9).fill('');
            let gameOver = false;
            let playerTurn = true;

            function checkWin(board, player) {
                const wins = [
                    [0,1,2],[3,4,5],[6,7,8],
                    [0,3,6],[1,4,7],[2,5,8],
                    [0,4,8],[2,4,6]
                ];
                return wins.some(combo => combo.every(i => board[i] === player));
            }

            function getEmpty(board) {
                return board.reduce((arr, cell, i) => cell === '' ? [...arr, i] : arr, []);
            }

            function updateBoardUI() {
                cells.forEach((cell, i) => {
                    cell.textContent = board[i];
                    cell.classList.toggle('x-symbol', board[i] === 'X');
                    cell.classList.toggle('o-symbol', board[i] === 'O');
                });
            }

            function setMessage(text) {
                msgEl.textContent = text;
            }

            function aiMove() {
                const empty = getEmpty(board);
                if (empty.length === 0) return;
                const randomIndex = empty[Math.floor(Math.random() * empty.length)];
                board[randomIndex] = 'O';
                updateBoardUI();
                if (checkWin(board, 'O')) {
                    gameOver = true;
                    setMessage('😈 Bot wins! But the page is still missing…');
                    triggerCelebration('lose');
                    playWinnerSound();
                } else if (getEmpty(board).length === 0) {
                    gameOver = true;
                    setMessage('🤝 Draw! Like your search results – nothing found.');
                } else {
                    playerTurn = true;
                    setMessage('Your turn!');
                }
            }

            function cellClickHandler(e) {
                if (!playerTurn || gameOver) return;
                const index = parseInt(e.target.dataset.index);
                if (board[index] !== '') return;
                board[index] = 'X';
                updateBoardUI();
                playClickSound();

                if (checkWin(board, 'X')) {
                    gameOver = true;
                    setMessage('🎉 You win! But the page still doesn’t exist. Time to go home?');
                    triggerCelebration('win');
                    playWinnerSound();
                } else if (getEmpty(board).length === 0) {
                    gameOver = true;
                    setMessage('🤝 Draw. Even the game is undecided – unlike this URL.');
                } else {
                    playerTurn = false;
                    setMessage('Bot is thinking…');
                    setTimeout(aiMove, 400);
                }
            }

            function resetGame() {
                board = Array(9).fill('');
                gameOver = false;
                playerTurn = true;
                updateBoardUI();
                setMessage('Your turn! (You are X)');
                hideCelebration();
            }

            function playClickSound() {
                if (typeof playSound === 'function') playSound('click');
            }

            function playWinnerSound() {
                if (typeof playSound === 'function') playSound('winner');
            }

            function triggerCelebration(type) {
                const overlay = document.getElementById('celebrationOverlay');
                if (!overlay) return;
                overlay.innerHTML = '';
                const emojis = ['🎉','🎉','👏','🏆','🤪','❌','⭕','🤷'];
                for (let i = 0; i < 10; i++) {
                    const span = document.createElement('span');
                    span.className = 'celebration-emoji';
                    span.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    span.style.left = Math.random() * 100 + '%';
                    span.style.top = Math.random() * 100 + '%';
                    overlay.appendChild(span);
                }
                overlay.style.display = 'flex';
                setTimeout(() => { overlay.style.display = 'none'; }, 2000);
            }

            function hideCelebration() {
                const overlay = document.getElementById('celebrationOverlay');
                if (overlay) overlay.style.display = 'none';
            }

            cells.forEach(cell => cell.addEventListener('click', cellClickHandler));
            resetBtn.addEventListener('click', resetGame);

            // Initialize theme and sound
            document.addEventListener('DOMContentLoaded', () => {
                if (typeof initTheme === 'function') initTheme();
                if (typeof initSoundManager === 'function') initSoundManager();
                updateBoardUI();
            });
        })();
    </script>
</body>
</html>
