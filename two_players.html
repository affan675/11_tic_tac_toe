<!-- xOarena/two_players.html -->
<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>X O Arena — 2 Players</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Preloader -->
    <div id="preloader" class="preloader">
      <div class="preloader-content">
        <h1 class="preloader-text">X O Arena</h1>
        <p class="preloader-tagline">Play. Learn. Conquer.</p>
        <div class="preloader-fight">
          <span class="fighter fighter-x">X</span>
          <span class="fighter fighter-o">O</span>
        </div>
        <div class="preloader-bar-container">
          <div class="preloader-bar" id="preloaderBar"></div>
        </div>
      </div>
    </div>
    <!-- Custom Cursor -->
    <div id="customCursor" class="custom-cursor"></div>

    <!-- Left Vertical Navbar -->
    <nav class="nav-vertical" id="navVertical">
      <a href="index.html" class="nav-icon" title="Home" data-page="home">🏠</a>
      <a
        href="two_players.html"
        class="nav-icon active"
        title="2 Players"
        data-page="two_players"
        >👥</a
      >
      <a href="ai.html" class="nav-icon" title="AI Bots" data-page="ai">🤖</a>
      <a href="learn.html" class="nav-icon" title="Learn" data-page="learn"
        >📘</a
      >
      <a
        href="settings.html"
        class="nav-icon"
        title="Settings"
        data-page="settings"
        >⚙️</a
      >
      <a
        href="creator.html"
        class="nav-icon"
        title="Creator"
        data-page="creator"
        >👤</a
      >
    </nav>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Audio Elements -->
    <audio id="clickSound" preload="auto" src="assets/sounds/click.mp3"></audio>
    <audio
      id="winnerSound"
      preload="auto"
      src="assets/sounds/winner.mp3"
    ></audio>
    <audio
      id="achievementSound"
      preload="auto"
      src="assets/sounds/achievement.mp3"
    ></audio>

    <!-- Main Content -->
    <main class="main-content game-main">
      <div class="game-container">
        <h1 class="game-page-title">👥 2 Player Mode</h1>

        <!-- Turn Indicator -->
        <div class="turn-indicator" id="turnIndicator">
          <span class="turn-label">Current Turn:</span>
          <span class="turn-symbol turn-x active" id="turnSymbol">X</span>
        </div>

        <!-- Scoreboard -->
        <div class="scoreboard">
          <div class="score-item score-x">
            <span class="score-symbol">X</span>
            <span class="score-value" id="scoreX">0</span>
          </div>
          <div class="score-item score-draws">
            <span class="score-label">Draws</span>
            <span class="score-value" id="scoreDraws">0</span>
          </div>
          <div class="score-item score-o">
            <span class="score-symbol">O</span>
            <span class="score-value" id="scoreO">0</span>
          </div>
        </div>

        <!-- Game Board -->
        <div class="game-board" id="gameBoard">
          <div class="cell" data-index="0"></div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
        </div>

        <!-- Game Status Message -->
        <div class="game-status" id="gameStatus"></div>

        <!-- Buttons -->
        <div class="game-actions">
          <button class="btn btn-primary" id="resetBtn">🔄 Reset Game</button>
          <button class="btn btn-secondary" id="newGameBtn">🆕 New Game</button>
        </div>
      </div>
    </main>

    <!-- Right-Click Menu -->
    <div id="rightClickMenu" class="right-click-menu">
      <button data-action="reset">🔄 Reset Game</button>
      <button data-action="new">🆕 New Game</button>
      <button data-action="theme">🎨 Toggle Theme</button>
    </div>

    <!-- Celebration Overlay -->
    <div id="celebrationOverlay" class="celebration-overlay"></div>

    <script src="js/preloader.js"></script>
    <script src="js/customCursor.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/common.js"></script>
    <script src="js/tabWelcome.js"></script>
    <script src="js/keyboardShortcuts.js"></script>
    <script src="js/soundManager.js"></script>
    <script src="js/rightClickMenu.js"></script>
    <script src="js/gameLogic.js"></script>
    <script src="js/twoPlayer.js"></script>
    <script src="js/achievements.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof initPreloader === "function") initPreloader();
        if (typeof initCustomCursor === "function") initCustomCursor();
        if (typeof initTheme === "function") initTheme();
        if (typeof initCommon === "function") initCommon();
        if (typeof initTabWelcome === "function") initTabWelcome();
        if (typeof initKeyboardShortcuts === "function")
          initKeyboardShortcuts();
        if (typeof initSoundManager === "function") initSoundManager();
        if (typeof initRightClickMenu === "function") initRightClickMenu();
        if (typeof initTwoPlayer === "function") initTwoPlayer();
        if (typeof initAchievements === "function") initAchievements();
      });
    </script>
    <script>
      // xOarena/js/twoPlayer.js
      (function () {
        let game,
          boardElement,
          turnSymbol,
          gameStatus,
          scoreX,
          scoreO,
          scoreDraws;
        let scores = { X: 0, O: 0, draws: 0 };

        function updateUI() {
          const board = game.getBoard();
          const cells = boardElement.querySelectorAll(".cell");
          cells.forEach((cell, i) => {
            cell.textContent = board[i];
            cell.classList.toggle("x-symbol", board[i] === "X");
            cell.classList.toggle("o-symbol", board[i] === "O");
          });

          if (!game.isGameOver()) {
            turnSymbol.textContent = game.getCurrentPlayer();
            turnSymbol.classList.toggle(
              "turn-x",
              game.getCurrentPlayer() === "X",
            );
            turnSymbol.classList.toggle(
              "turn-o",
              game.getCurrentPlayer() === "O",
            );
            turnSymbol.classList.add("active");
            gameStatus.textContent = "";
          } else {
            turnSymbol.classList.remove("active");
            if (game.getWinner()) {
              gameStatus.textContent = `🎉 Player ${game.getWinner()} wins!`;
              triggerCelebration();
              if (window.playSound) window.playSound("winner");
              updateScores(game.getWinner());
            } else {
              gameStatus.textContent = "🤝 Draw!";
              updateScores(null);
            }
            highlightWinCombo();
          }
        }

        function updateScores(winner) {
          // Update local scores
          if (winner === "X") {
            scores.X++;
            scoreX.textContent = scores.X;
          } else if (winner === "O") {
            scores.O++;
            scoreO.textContent = scores.O;
          } else {
            scores.draws++;
            scoreDraws.textContent = scores.draws;
          }
          localStorage.setItem("xOarena_stats", JSON.stringify(scores));

          // Update global achievement stats
          if (typeof window.incrementStat === "function") {
            window.incrementStat("gamesPlayed", 1);
            if (winner) {
              window.incrementStat("wins", 1);
              window.updateStreak(true);
            } else {
              window.incrementStat("draws", 1);
              window.updateStreak(false);
            }
          }
        }

        function highlightWinCombo() {
          const combo = game.getWinCombo();
          if (combo && combo.length) {
            combo.forEach((i) =>
              boardElement
                .querySelector(`.cell[data-index="${i}"]`)
                ?.classList.add("win-highlight"),
            );
          }
        }

        function triggerCelebration() {
          const overlay = document.getElementById("celebrationOverlay");
          if (!overlay) return;
          overlay.innerHTML = "";
          const emojis = ["🎉", "🎉", "🎉", "👏", "🏆", "✨", "🥳", "🎊"];
          for (let i = 0; i < 12; i++) {
            const span = document.createElement("span");
            span.className = "celebration-emoji";
            span.textContent =
              emojis[Math.floor(Math.random() * emojis.length)];
            span.style.left = Math.random() * 100 + "%";
            span.style.top = Math.random() * 100 + "%";
            span.style.animationDelay = Math.random() * 0.4 + "s";
            overlay.appendChild(span);
          }
          overlay.style.display = "flex";
          setTimeout(() => {
            overlay.style.display = "none";
          }, 2500);
        }

        function cellClickHandler(e) {
          const cell = e.target;
          if (!cell.classList.contains("cell")) return;
          const index = parseInt(cell.dataset.index);
          if (game.isGameOver() || game.getBoard()[index] !== "") return;
          game.makeMove(index);
          // Track clicks on cells
          if (typeof window.incrementStat === "function") {
            window.incrementStat("clicks", 1);
          }
          updateUI();
          if (window.checkAchievements) window.checkAchievements();
        }

        window.resetGame = function () {
          game.reset();
          updateUI();
          boardElement
            .querySelectorAll(".cell")
            .forEach((cell) => cell.classList.remove("win-highlight"));
        };

        window.newGame = function () {
          scores = { X: 0, O: 0, draws: 0 };
          scoreX.textContent = "0";
          scoreO.textContent = "0";
          scoreDraws.textContent = "0";
          localStorage.setItem("xOarena_stats", JSON.stringify(scores));
          window.resetGame();
        };

        window.initTwoPlayer = function () {
          game = new window.GameLogic();
          boardElement = document.getElementById("gameBoard");
          turnSymbol = document.getElementById("turnSymbol");
          gameStatus = document.getElementById("gameStatus");
          scoreX = document.getElementById("scoreX");
          scoreO = document.getElementById("scoreO");
          scoreDraws = document.getElementById("scoreDraws");

          const saved = JSON.parse(localStorage.getItem("xOarena_stats"));
          if (saved) {
            scores = saved;
            scoreX.textContent = scores.X;
            scoreO.textContent = scores.O;
            scoreDraws.textContent = scores.draws;
          }

          boardElement.addEventListener("click", cellClickHandler);
          document
            .getElementById("resetBtn")
            .addEventListener("click", window.resetGame);
          document
            .getElementById("newGameBtn")
            .addEventListener("click", window.newGame);

          updateUI();
        };
      })();
    </script>
  </body>
</html>
